<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #102033; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #516173; }
      .board { fill: #1b4332; stroke: #081c15; stroke-width: 3; rx: 8; }
      .module { fill: #ffffff; stroke: #8294a6; stroke-width: 2; rx: 6; }
      .note { fill: #fff9db; stroke: #d4a72c; stroke-width: 2; rx: 6; }
      .text { font: 600 18px Arial, sans-serif; fill: #203247; }
      .small { font: 400 15px Arial, sans-serif; fill: #516173; }
      .pin { font: 700 16px Consolas, monospace; fill: #ffffff; }
      .boardTitle { font: 700 25px Arial, sans-serif; fill: #ffffff; }
      .sig { stroke: #2868b2; stroke-width: 4; fill: none; }
      .five { stroke: #d62828; stroke-width: 5; fill: none; }
      .gnd { stroke: #20252b; stroke-width: 5; fill: none; }
      .boot { stroke: #7b2cbf; stroke-width: 4; fill: none; stroke-dasharray: 10 7; }
      .net { stroke: #177e89; stroke-width: 5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#177e89"/>
    </marker>
  </defs>
  <rect width="1500" height="980" fill="#eef3f7"/>
  <text x="55" y="58" class="title">AI-Thinker ESP32-CAM - Power, Programming, and Backend Wiring</text>
  <text x="55" y="88" class="subtitle">The OV2640 camera is connected internally. External wiring is for power and firmware upload.</text>

  <rect x="555" y="170" width="390" height="520" class="board"/>
  <text x="642" y="215" class="boardTitle">AI-THINKER ESP32-CAM</text>
  <rect x="635" y="255" width="230" height="160" fill="#274c3b" stroke="#95d5b2" stroke-width="2" rx="6"/>
  <circle cx="750" cy="335" r="48" fill="#081c15" stroke="#b7e4c7" stroke-width="5"/>
  <circle cx="750" cy="335" r="20" fill="#40916c"/>
  <text x="694" y="448" class="pin">OV2640 CAMERA</text>
  <text x="590" y="535" class="pin">5V</text>
  <text x="590" y="585" class="pin">GND</text>
  <text x="590" y="635" class="pin">GPIO0 / BOOT</text>
  <text x="810" y="535" class="pin">U0R / GPIO3</text>
  <text x="810" y="585" class="pin">U0T / GPIO1</text>

  <rect x="70" y="220" width="330" height="220" class="module"/>
  <text x="135" y="260" class="text">USB-TTL ADAPTER</text>
  <text x="110" y="310" class="small">TX, 3.3 V logic</text>
  <text x="110" y="350" class="small">RX, 3.3 V logic</text>
  <text x="110" y="390" class="small">GND</text>
  <path d="M400 310 L480 310 L480 535 L810 535" class="sig"/>
  <path d="M400 350 L500 350 L500 585 L810 585" class="sig"/>
  <path d="M400 390 L470 390 L470 585 L590 585" class="gnd"/>

  <rect x="80" y="550" width="300" height="130" class="module"/>
  <text x="123" y="590" class="text">UPLOAD JUMPER</text>
  <text x="115" y="630" class="small">GPIO0 to GND only while flashing</text>
  <path d="M380 635 L590 635" class="boot"/>
  <path d="M230 680 L230 750 L590 750 L590 585" class="gnd"/>

  <rect x="1080" y="200" width="320" height="170" class="module"/>
  <text x="1142" y="242" class="text">REGULATED 5 V / 1 A</text>
  <text x="1120" y="292" class="small">+5 V to ESP32-CAM 5V pin</text>
  <text x="1120" y="330" class="small">0 V to ESP32-CAM GND</text>
  <path d="M1080 290 L1000 290 L1000 535 L945 535" class="five"/>
  <path d="M1080 330 L1020 330 L1020 585 L945 585" class="gnd"/>

  <rect x="1080" y="470" width="320" height="160" class="module"/>
  <text x="1185" y="510" class="text">Wi-Fi AP</text>
  <text x="1120" y="552" class="small">ESP32-CAM and backend must</text>
  <text x="1120" y="580" class="small">be mutually reachable by LAN IP.</text>
  <path d="M945 470 L1080 530" class="net"/>

  <rect x="1080" y="725" width="320" height="140" class="module"/>
  <text x="1140" y="767" class="text">NODE BACKEND :5001</text>
  <text x="1120" y="810" class="small">POST /api/qr-scan</text>
  <text x="1120" y="838" class="small">Listen on 0.0.0.0, use LAN IP</text>
  <path d="M1240 630 L1240 725" class="net"/>

  <rect x="70" y="790" width="850" height="130" class="note"/>
  <text x="100" y="830" class="text">UPLOAD SEQUENCE</text>
  <text x="100" y="866" class="small">1. GPIO0-GND.  2. Reset/power-cycle.  3. Upload.  4. Remove GPIO0-GND.  5. Reset again.</text>
  <text x="100" y="898" class="small">A weak USB-TTL 5 V output can cause brownouts; use the dedicated regulated 5 V supply.</text>
</svg>
