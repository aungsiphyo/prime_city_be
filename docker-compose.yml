services:
  backend:
    build: ./Node_Backend
    container_name: smartcity_backend
    ports:
      - "5001:5001"

    volumes:
      - ./Node_Backend:/app
      - /app/node_modules

  mobile:
    build: ./Smart_city_Mobile
    container_name: smartcity_mobile
    ports:
      - "8081:8081"

    volumes:
      - ./Smart_city_Mobile:/app
      - /app/node_modules

    depends_on:
      - backend